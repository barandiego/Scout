name: Scout V0
run-name: Scout V0 — ${{ inputs.mode }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: cycle | report | calibrate
        required: true
        default: cycle
        type: choice
        options: [cycle, report, calibrate]
permissions:
  contents: write
  actions: read
concurrency:
  group: scout-v0-state
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q scout tests
      - run: python -m pip check
      - run: pytest -q
      - run: python -m scout.cli validate
      - run: python -m scout.cli calibrate
      - name: Select mode
        id: mode
        env:
          SCOUT_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          case "$SCOUT_MODE" in cycle|report|calibrate) ;; *) exit 1 ;; esac
          echo "mode=$SCOUT_MODE" >> "$GITHUB_OUTPUT"
      - name: Verify preceding run persisted
        if: steps.mode.outputs.mode == 'cycle'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          previous=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/scout.yml/runs?branch=${GITHUB_REF_NAME}&per_page=100" --jq ".workflow_runs | map(select(.id != ${GITHUB_RUN_ID} and .display_title != \"Scout V0 — report\" and .display_title != \"Scout V0 — calibrate\")) | .[0].id // empty")
          if [ -z "$previous" ]; then
            prior_count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/scout.yml/runs?branch=${GITHUB_REF_NAME}&per_page=100" --jq ".workflow_runs | map(select(.id != ${GITHUB_RUN_ID})) | length")
            if [ "$prior_count" != "0" ]; then
              echo "No preceding cycle could be verified in recent history. Reconcile state before paid work."
              exit 1
            fi
          fi
          if [ -n "$previous" ]; then
            persisted=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${previous}/jobs" --jq '[.jobs[].steps[] | select(.name == "Persist state and reports" and .conclusion == "success")] | length')
            if [ "$persisted" = "0" ]; then
              echo "Previous run did not confirm state persistence. Recover its state artifact before any further paid run."
              exit 1
            fi
          fi
      - name: API/model preflight
        if: steps.mode.outputs.mode == 'cycle'
        run: python -m scout.cli preflight
      - name: Run Scout
        id: scout
        run: python -m scout.cli "${{ steps.mode.outputs.mode }}"
      - name: Preserve recovery artifact
        if: always() && steps.scout.outcome != 'skipped' && steps.scout.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: scout-state-${{ github.run_id }}
          path: |
            state/*.jsonl
            reports/latest.md
          retention-days: 30
      - name: Persist state and reports
        if: always() && steps.scout.outcome != 'skipped' && steps.scout.outcome != ''
        shell: bash
        run: |
          git config user.name "scout-v0[bot]"
          git config user.email "scout-v0[bot]@users.noreply.github.com"
          git add state reports
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: persist Scout V0 state"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

