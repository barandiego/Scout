[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "scout-v0"
version = "0.1.1"
description = "Evidence-first autonomous opportunity intelligence"
requires-python = ">=3.11"
dependencies = ["openai>=3.23,<4", "pydantic>=2.13,<3", "PyYAML>=6,<7"]
[project.optional-dependencies]
dev = ["pytest>=9,<10"]
[project.scripts]
scout = "scout.cli:main"
[tool.setuptools.packages.find]
include = ["scout*"]
exclude = ["state*", "config*", "reports*", "tests*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
