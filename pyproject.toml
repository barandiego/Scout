[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-v0"
version = "0.1.0"
description = "Evidence-first autonomous opportunity intelligence"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.109.0",
  "pydantic>=2.9",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
scout = "scout.cli:main"

[tool.setuptools.packages.find]
include = ["scout*"]
exclude = ["state*", "config*", "reports*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
