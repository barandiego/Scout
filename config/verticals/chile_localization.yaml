name: chile_localization
criteria:
  - verifiable foreign implementation product or economic proof
  - independently research current Chilean incumbents substitutions and availability
  - concrete adaptation beyond translation or copying branding
  - realistic Chilean market demand distribution and expected landed costs
  - supplier license patents certification taxes and local regulatory compatibility
  - small defensible pilot with clear customer and measurable outcome
fatal_conditions:
  - local substitutes already adequately meet the same job and no credible differentiation
  - legally inaccessible intellectual property or necessary import/license path
  - foreign traction entirely anecdotal
  - Chilean price or labor economics eliminate plausible value capture
notes: Foreign success is proof of feasibility abroad, never proof of Chilean willingness to pay.
