name: asymmetric_investing
criteria:
  - a named investable underlying security token network or economic asset and access venue
  - dated early adoption supply demand technical or financial leading indicator
  - risked valuation or economic network activity versus expectations
  - likely catalysts time horizon and explicit path to liquidity
  - balance sheet security custody dilution token unlock and governance risks
  - a plausible reason public markets have mispriced or underappreciated evidence
fatal_conditions:
  - post-hoc growth chart offered as a forward-looking edge
  - assumed 10x upside without valuation liquidity or loss scenarios
  - manipulation promotional claims or unaudited unverifiable market metrics
  - unavailable unauthorized or impractically illiquid investment vehicle
notes: A research survivor is a watchlist thesis, never a buy instruction, approved trade or promise to find the next Bitcoin.
