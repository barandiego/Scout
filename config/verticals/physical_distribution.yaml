name: physical_distribution
criteria:
  - identifiable sourced physical product and buyer job
  - actual production availability and supplier reliability
  - real competition in Chile rather than assumption of absence
  - MOQ freight landed cost customs warranty returns inventory and financing needs
  - defensible distribution partnership private-label or service bundle
  - inexpensive demand validation prior to inventory spending
fatal_conditions:
  - noncompliant or counterfeit product
  - no reasonable supplier access or after-sales support
  - landed price exceeds plausible customer willingness to pay without differentiation
  - claimed buyer demand unsupported by any real market signal
notes: Inventoryless dropshipping may be considered but must pass delivery refund and supplier risk economics.
