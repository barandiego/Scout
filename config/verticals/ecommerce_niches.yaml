name: ecommerce_niches
criteria:
  - concrete product category and specific underserved customer job
  - defensible product or distribution differentiation versus established sellers
  - evidence of real product demand and genuine seller supply gap in target geography
  - landed cost including shipping taxes duties refunds and fulfillment charges
  - realistic channel CAC repeat purchase and conversion economics
  - simple first demand validation test before committing to inventory
fatal_conditions:
  - no identifiable product or potential paying customer
  - presumed seller scarcity without verifiable local listings or competition check
  - imported landed cost or regulation eliminates a plausible contribution margin
  - unverifiable demand or fabricated marketplace figures
notes: Research survivor means plausible testable wedge only; high demand and low seller count must never be inferred from hype.
