name: competitive_positioning
criteria:
  - explicit established market and buying segment
  - incumbent product or customer-experience weaknesses supported by evidence
  - positioning wedge in price delivery quality convenience vertical focus or underserved geography
  - switching behavior and distribution rather than generic more features claims
  - unit economics that withstand incumbent retaliation and customer acquisition costs
fatal_conditions:
  - no demonstrable customer pain or reason to change providers
  - impossible access to buyers supply chain or necessary technology
  - business model requires unlimited subsidies or implausible incumbent negligence
  - pure undifferentiated me-too product with no specific customer segment
notes: A large market alone is not an opportunity; a narrow credible niche may be.
